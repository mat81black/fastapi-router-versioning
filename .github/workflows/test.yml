name: Test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # cron every week on monday
    - cron: "0 0 * * 1"

permissions: {}

env:
  UV_NO_SYNC: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    timeout-minutes: 5
    # Set job outputs to values from filter step
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #sync-pin:checkout
        with:
          persist-credentials: false
      # For pull requests it's not necessary to checkout the code but for the main branch it is
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.2 #sync-pin:paths-filter
        id: filter
        with:
          filters: |
            src:
              - .github/workflows/test.yml
              - examples/**
              - fastapi_router_versioning/**
              - scripts/**
              - tests/**
              - .python-version
              - pyproject.toml
              - uv.lock

  test:
    needs:
      - changes
    if: needs.changes.outputs.src == 'true' || github.ref == 'refs/heads/main'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        fastapi-version: [ "0.120.0", "0.136.0", "latest" ]

        include:
          # Designates which job collects coverage
          - python-version: "3.14"
            fastapi-version: "latest"
            coverage: "coverage"

    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #sync-pin:checkout-2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 #sync-pin:setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v9.0.0 #sync-pin:setup-uv
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}-fa${{ matrix.fastapi-version }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Dependencies
        run: uv sync

      - name: Override FastAPI version
        if: matrix.fastapi-version != 'latest'
        run: uv pip install "fastapi==${{ matrix.fastapi-version }}"

      - name: Prepare coverage dir
        run: mkdir coverage

      - name: Test
        # GitHub Windows runners ship bash natively
        run: uv run --no-sync bash scripts/test-cov.sh
        env:
          COVERAGE_FILE: coverage/.coverage.py${{ matrix.python-version }}-fa${{ matrix.fastapi-version }}
          CONTEXT: py${{ matrix.python-version }}-fa${{ matrix.fastapi-version }}

      - name: Store coverage files
        if: matrix.coverage == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 #sync-pin:upload-artifact
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.fastapi-version }}
          path: coverage
          include-hidden-files: true

  regression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #sync-pin:checkout-3
        with:
          ref: ${{ github.sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 0

      - name: Find changed tests
        if: github.event_name == 'pull_request'
        id: changed-tests
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=AM -z "$BASE_SHA" "$HEAD_SHA" -- tests \
            | while IFS= read -r -d '' file; do
                case "$(basename "$file")" in
                  test_*.py) printf '%s\0' "$file" ;;
                esac
              done > "$RUNNER_TEMP/changed-tests"
          if [ -s "$RUNNER_TEMP/changed-tests" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            git diff --binary "$BASE_SHA" "$HEAD_SHA" -- tests \
              > "$RUNNER_TEMP/tests.patch"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No added or modified test files; regression proof is not applicable."
          fi

      - name: Check out the base revision
        if: steps.changed-tests.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #sync-pin:checkout-4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Python
        if: steps.changed-tests.outputs.found == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 #sync-pin:setup-python-2
        with:
          python-version-file: "base/.python-version"

      - name: Setup uv
        if: steps.changed-tests.outputs.found == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v9.0.0 #sync-pin:setup-uv-2
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          enable-cache: true

      - name: Run the changed tests against the base code
        if: steps.changed-tests.outputs.found == 'true'
        working-directory: base
        run: |
          git apply "$RUNNER_TEMP/tests.patch"
          uv sync --locked
          set +e
          xargs -0 uv run --no-sync pytest -- < "$RUNNER_TEMP/changed-tests"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::warning::The changed tests already pass on the base revision. Check whether the fix is still needed."
            echo "### Regression proof: base already passes :warning:" >> "$GITHUB_STEP_SUMMARY"
            echo "The changed tests pass without the pull request's code changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The changed tests fail on the base revision as expected (pytest exit code $status)."
            echo "### Regression proof: base fails as expected :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          fi

  coverage-combine:
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #sync-pin:checkout-5
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v9.0.0 #sync-pin:setup-uv-3
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Dependencies
        run: uv sync --locked

      - name: Get coverage files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 #sync-pin:download-artifact
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - run: ls -la coverage
      - run: uv run coverage combine coverage
      - run: uv run coverage html --title "Coverage for ${{ github.sha }}"
      - run: uv run coverage xml

      - name: Store coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 #sync-pin:upload-artifact-2
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0 #sync-pin:codecov-action
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

      - run: uv run coverage report --fail-under=100

  # https://github.com/marketplace/actions/alls-green#why
  test-alls-green:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test
      - coverage-combine
      - regression-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2 #sync-pin:alls-green
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test,coverage-combine
