name: Build Docs

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    timeout-minutes: 5
    # Set job outputs to values from filter step
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #sync-pin:checkout-6
        with:
          persist-credentials: false
      # For pull requests it's not necessary to checkout the code but for the main branch it is
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.2 #sync-pin:paths-filter-2
        id: filter
        with:
          filters: |
            docs:
              - .github/workflows/build-docs.yml
              - .github/workflows/deploy-docs.yml
              - docs/**
              - docs_src/**
              - examples/**
              - fastapi_router_versioning/**
              - mkdocs.yml
              - overrides/**
              - scripts/docs-build.sh
              - pyproject.toml
              - uv.lock

  build-docs:
    needs:
      - changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #sync-pin:checkout-7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 #sync-pin:setup-python-3
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v9.0.0 #sync-pin:setup-uv-4
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          # Zensical's own docs advise against caching its build output on CI for now.
          enable-cache: false

      - name: Install Dependencies
        run: uv sync --locked --no-dev --group docs

      - name: Build docs
        run: uv run --no-sync bash scripts/docs-build.sh

      # The site is deployed by Deploy Docs, which runs once this workflow has finished
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 #sync-pin:upload-artifact-3
        with:
          name: docs-site
          path: ./site

  # https://github.com/marketplace/actions/alls-green#why
  docs-alls-green:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - changes
      - build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.2.2 #sync-pin:alls-green-2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: build-docs
